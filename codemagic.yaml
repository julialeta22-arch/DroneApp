workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 18.17.0
      vars:
        EXPO_TOKEN: "yIZ1UmdY6PZKxvmQgsicoZRmDhMkr5lvsUmJB5j-"
        EXPO_NO_DOTENV: "1"
    scripts:
      - name: Find project root
        script: |
          PROJECT_ROOT=$CM_BUILD_DIR
          if [ -d "$CM_BUILD_DIR/DroneApp" ]; then
            PROJECT_ROOT=$CM_BUILD_DIR/DroneApp
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $CM_ENV
          echo "Project root: $PROJECT_ROOT"
      - name: Install dependencies
        script: |
          cd $PROJECT_ROOT
          npm install --legacy-peer-deps
      - name: Install EAS CLI
        script: npm install -g eas-cli
      - name: Build Android APK with EAS
        script: |
          cd $PROJECT_ROOT
          npx eas-cli build --platform android --profile preview --non-interactive
    artifacts:
      - "**/*.apk"
